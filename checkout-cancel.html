<!DOCTYPE html>
<html lang="en">
<head>
    <script src="js/zoom-lock.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout cancelled — Eeks Eye</title>
    <link rel="icon" type="image/png" href="images/tags.png">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: #fff;
            color: #111;
            font-family: 'Inter', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            box-sizing: border-box;
        }
        body > .checkout-result {
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        body > .site-footer {
            margin-top: auto;
        }
        .checkout-result {
            max-width: 520px;
            text-align: center;
        }
        .checkout-result h1 {
            font-size: 1.75rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin: 0 0 1rem;
            color: #111;
        }
        .checkout-result p {
            color: #444;
            line-height: 1.6;
            margin: 0 0 1.5rem;
        }
        .checkout-result a {
            display: inline-block;
            background: #111;
            color: #fff;
            text-decoration: none;
            padding: 0.85rem 1.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            border-radius: 4px;
        }
        .checkout-result a:hover {
            background: #333;
        }
    </style>
</head>
<body>
    <div class="checkout-result">
        <h1>Checkout cancelled</h1>
        <p>No charge was made. You can return to the product and try again whenever you’re ready.</p>
        <a href="explore.html">Back to Explore</a>
    </div>
    <footer class="site-footer explore-footer-editorial" hidden></footer>

    <script src="js/page-transition.js"></script>
    <script src="js/site-footer.js"></script>
    <script src="js/footer-links.js"></script>
</body>
</html>
